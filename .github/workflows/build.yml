name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Fetch and Patch Tweak.xm
        run: |
          curl -fsSL https://raw.githubusercontent.com/n3d1117/XNotForMe/main/Tweak.xm -o Tweak.xm
          python3 -c "
          with open('Tweak.xm', 'r') as f:
              content = f.read()
          patch = 'static inline NSInteger tweak_min(NSInteger a, NSInteger b) { return (a < b) ? a : b; }\n'
          content = patch + content.replace('MIN(', 'tweak_min(')
          with open('Tweak.xm', 'w') as f:
              f.write(content)
          "

      - name: Setup Theos Files
        run: |
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64
          INSTALL_TARGET_PROCESSES = Twitter

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = XNotForMe
          XNotForMe_FILES = Tweak.xm
          XNotForMe_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat << 'EOF' > control
          Package: com.n3d1117.xnotforme
          Name: XNotForMe
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: Remove For You tab
          Maintainer: n3d1117
          Author: n3d1117
          Section: Tweaks
          EOF

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          find packages -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XNotForMe-Ready
          path: output/*
